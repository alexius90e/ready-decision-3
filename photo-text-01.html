<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>photo-text-01</title>
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/photo-text-01.css" />
  </head>
  <body>
    <section class="photo-text-01">
      <div class="photo-text-01__wrapper">
        <figure class="photo-text-01__photo">
          <img
            class="photo-text-01__photo-image photo-text-01__photo-image_desktop"
            src="./assets/photo-text-01/photo-text-01-img-desktop.jpg"
            alt="photo"
          />
          <img
            class="photo-text-01__photo-image photo-text-01__photo-image_mobile"
            src="./assets/photo-text-01/photo-text-01-img-mobile.jpg"
            alt="photo"
          />
        </figure>

        <div class="photo-text-01__content">
          <div class="photo-text-01__content-title">
            <div class="photo-text-01__content-title-row">
              Эффективная команда <mark class="photo-text-01__content-title-row-mark">=</mark>
            </div>
            <div class="photo-text-01__content-title-row">эффективные решения</div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
