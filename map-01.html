                  data-map-url="https://yandex.by/map-widget/v1/org/babushkina_i_k/1092955920/?ll=27.687406%2C53.809280&z=16"

                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="map-01__maps">
        <div class="map-01__maps-item" data-map-id="0">
          <iframe
            class="map-01__maps-item-iframe"
            src=""
            width="560"
            height="400"
            frameborder="0"
            allowfullscreen="true"
          ></iframe>
        </div>
      </div>
    </section>
  </body>
</html>
