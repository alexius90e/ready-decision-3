<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>contacts-03</title>
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/contacts-03.css" />
  </head>
  <body>
    <section class="contacts-03">
      <div class="container">
        <div class="contacts-03__wrapper">
          <div class="contacts-03__contacts">
            <div class="contacts-03__contacts-content">
              <div class="contacts-03__contacts-block">
                <span class="contacts-03__contacts-block-label">Адрес</span>
                <span class="contacts-03__contacts-block-text">
                  г. Краснодар, Ростовское шоссе, 11Б
                </span>
              </div>

              <div class="contacts-03__contacts-block">
                <span class="contacts-03__contacts-block-label">График</span>
                <span class="contacts-03__contacts-block-text">Ежедневно 9:00–19:00</span>
              </div>

              <div class="contacts-03__contacts-block">
                <span class="contacts-03__contacts-block-label">Телефон</span>
                <a class="contacts-03__contacts-block-link" href="#">+7 938 409-60-64</a>
              </div>

              <div class="contacts-03__contacts-block">
                <span class="contacts-03__contacts-block-label">Почта</span>
                <a class="contacts-03__contacts-block-link" href="#">info@provakator.ru</a>
              </div>
            </div>

            <div class="contacts-03__contacts-actions">
              <button
                class="contacts-03__contacts-actions-button contacts-03__contacts-actions-button_max"
              >
                <span class="contacts-03__contacts-actions-button-text">Получить консультацию</span>
              </button>
              <button
                class="contacts-03__contacts-actions-button contacts-03__contacts-actions-button_tg"
              >
                <span class="contacts-03__contacts-actions-button-text">Получить консультацию</span>
              </button>
            </div>
          </div>

          <div class="contacts-03__map">
            <figure class="contacts-03__map-figure">
              <img
                class="contacts-03__map-figure-image"
                src="./assets/contacts-03/map.jpg"
                alt="map"
              />
            </figure>

            <a
              class="contacts-03__map-link"
              href="https://yandex.ru/maps/?um=constructor%3A041628f89297c3ff34eb80402a23af0671281745d63ff6fabe0bd2210c7d81dd&amp;source=constructorStatic"
              target="_blank"
            >
              Открыть в Яндекс картах
            </a>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
