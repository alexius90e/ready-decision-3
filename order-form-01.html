<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>order-form-01</title>
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/order-form-01.css" />
  </head>
  <body>
    <section class="order-form-01">
      <div class="container">
        <div class="order-form-01__wrapper">
          <div class="order-form-01__order">
            <div class="order-form-01__order-title">
              Заполните простую форму, и наши менеджеры свяжутся с вами, ответят на любые вопросы и
              подготовят счет на оплату124358
            </div>

            <form class="order-form-01__order-form">
              <input
                class="order-form-01__order-form-input"
                type="text"
                name="name"
                placeholder="Имя"
              />

              <input
                class="order-form-01__order-form-input"
                type="tel"
                name="phone"
                placeholder="Номер телефона"
              />

              <input
                class="order-form-01__order-form-input"
                type="email"
                name="email"
                placeholder="Email"
              />

              <input
                class="order-form-01__order-form-input"
                type="text"
                name="company"
                placeholder="Название компании"
              />

              <input
                class="order-form-01__order-form-input"
                type="text"
                name="address"
                placeholder="Адрес доставки"
              />

              <textarea
                class="order-form-01__order-form-textarea"
                name="comment"
                placeholder="Поле для ввода комментария"
              ></textarea>
            </form>
          </div>

          <div class="order-form-01__total">
            <div class="order-form-01__total-price">
              <div class="order-form-01__total-price-title">Итого</div>
              <div class="order-form-01__total-price-value">76 837 ₽</div>
            </div>
          </div>

          <div class="order-form-01__controls">
            <div class="order-form-01__controls-disclaimer">
              Нажав на кнопку, вы даете согласие на обработку
              <a class="order-form-01__controls-disclaimer-link" href="#">персональных данных</a>
            </div>
            <div class="order-form-01__controls-submit">
              <button class="order-form-01__controls-submit-button button button_dark">
                Оформить заказ
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
