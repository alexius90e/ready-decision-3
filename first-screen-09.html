<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>first-screen-09</title>
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/first-screen-09.css" />
  </head>
  <body>
    <section class="first-screen-09">
      <div class="first-screen-09__main">
        <figure class="first-screen-09__main-bg">
          <img
            class="first-screen-09__main-bg-image first-screen-09__main-bg-image_desktop"
            src="./assets/first-screen-09/bg.jpg"
            alt="bg"
          />
          <img
            class="first-screen-09__main-bg-image first-screen-09__main-bg-image_mobile"
            src="./assets/first-screen-09/bg-mob.jpg"
            alt="bg"
          />
        </figure>

        <div class="first-screen-09__main-content">
          <div class="container">
            <h2 class="first-screen-09__main-content-title">
              Автомобили
              <br />
              без сюрпризов
            </h2>
            <p class="first-screen-09__main-content-description">
              Проверенная история каждого авто и уверенность на каждом этапе покупкиn
            </p>
          </div>
        </div>
      </div>

      <div class="first-screen-09__benefits">
        <div class="container">
          <div class="first-screen-09__benefits-list">
            <div class="first-screen-09__benefits-list-item">
              <figure class="first-screen-09__benefits-list-item-icon">
                <img
                  class="first-screen-09__benefits-list-item-icon-image"
                  src="./assets/first-screen-09/icon-1.svg"
                  alt="icon"
                />
              </figure>
              <div class="first-screen-09__benefits-list-item-text">Проверенные автомобили</div>
            </div>

            <div class="first-screen-09__benefits-list-item">
              <figure class="first-screen-09__benefits-list-item-icon">
                <img
                  class="first-screen-09__benefits-list-item-icon-image"
                  src="./assets/first-screen-09/icon-2.svg"
                  alt="icon"
                />
              </figure>
              <div class="first-screen-09__benefits-list-item-text">Юридическая чистота</div>
            </div>

            <div class="first-screen-09__benefits-list-item">
              <figure class="first-screen-09__benefits-list-item-icon">
                <img
                  class="first-screen-09__benefits-list-item-icon-image"
                  src="./assets/first-screen-09/icon-3.svg"
                  alt="icon"
                />
              </figure>
              <div class="first-screen-09__benefits-list-item-text">Кредит и Trade-In</div>
            </div>

            <div class="first-screen-09__benefits-list-item">
              <figure class="first-screen-09__benefits-list-item-icon">
                <img
                  class="first-screen-09__benefits-list-item-icon-image"
                  src="./assets/first-screen-09/icon-4.svg"
                  alt="icon"
                />
              </figure>
              <div class="first-screen-09__benefits-list-item-text">Помощь с оформлением</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
